<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS</title>
<style>
  :root {
    --bg1: #05010f;
    --bg2: #0d0530;
    --accent: #00f0ff;
    --accent2: #ff00d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg2) 0%, var(--bg1) 70%);
    overflow: hidden;
    font-family: 'Courier New', monospace;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  /* animated starfield behind everything */
  #stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  .panel {
    position: relative;
    z-index: 1;
    background: rgba(10, 6, 40, 0.72);
    border: 1px solid rgba(0, 240, 255, 0.35);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.12), inset 0 0 18px rgba(0, 240, 255, 0.06);
    color: #cfefff;
    text-align: left;
  }
  .panel h3 {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(0,240,255,.8);
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(0,240,255,.25);
    padding-bottom: 5px;
  }
  .panel .val {
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,.55);
    margin-bottom: 10px;
    font-weight: bold;
  }
  .panel .val:last-child { margin-bottom: 0; }
  .side {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 190px;
  }
  .side.right { align-items: stretch; }
  canvas.mini {
    display: block;
    margin: 0 auto;
    background: rgba(0,0,0,.35);
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,.12);
  }
  #boardWrap {
    position: relative;
    padding: 10px;
    background: rgba(5, 2, 25, 0.8);
    border-radius: 12px;
    border: 2px solid rgba(0, 240, 255, 0.5);
    box-shadow:
      0 0 40px rgba(0, 240, 255, 0.25),
      0 0 90px rgba(255, 0, 212, 0.12),
      inset 0 0 30px rgba(0, 0, 0, 0.7);
  }
  #board { display: block; border-radius: 6px; }
  #overlay {
    position: absolute; inset: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(3, 0, 18, 0.82);
    border-radius: 6px;
    z-index: 5;
    text-align: center;
    backdrop-filter: blur(2px);
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 46px;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #00f0ff, #7a5cff 55%, #ff00d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(0,240,255,.35);
    margin-bottom: 18px;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.04); filter: brightness(1.35); }
  }
  #overlay p {
    color: #bfe9ff;
    font-size: 14px;
    line-height: 1.9;
    margin-bottom: 6px;
  }
  #overlay .big {
    font-size: 20px;
    color: #fff;
    text-shadow: 0 0 12px rgba(255,255,255,.6);
    margin: 10px 0;
  }
  .blink { animation: blink 1.1s step-end infinite; color: var(--accent); font-size: 16px; margin-top: 14px; letter-spacing: 2px;}
  @keyframes blink { 50% { opacity: 0; } }
  #controls {
    font-size: 11px;
    color: #9fc6e8;
    line-height: 2;
  }
  #controls b { color: #fff; display: inline-block; min-width: 78px; text-align: left; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="side left">
  <div class="panel">
    <h3>HOLD</h3>
    <canvas id="hold" class="mini" width="120" height="90"></canvas>
  </div>
  <div class="panel">
    <h3>PUNTI</h3>
    <div class="val" id="score">0</div>
    <h3>LIVELLO</h3>
    <div class="val" id="level">1</div>
    <h3>LINEE</h3>
    <div class="val" id="lines">0</div>
  </div>
</div>

<div id="boardWrap">
  <canvas id="board"></canvas>
  <div id="overlay">
    <h1 id="ovTitle">TETRIS</h1>
    <p id="ovMsg"></p>
    <p class="big" id="ovBig"></p>
    <p class="blink" id="ovBlink">PREMI INVIO PER INIZIARE</p>
  </div>
</div>

<div class="side right">
  <div class="panel">
    <h3>PROSSIMA</h3>
    <canvas id="next" class="mini" width="120" height="210"></canvas>
  </div>
  <div class="panel" id="controls">
    <h3>CONTROLLI</h3>
    <b>← →</b> muovi<br>
    <b>↑ / X</b> ruota<br>
    <b>Z</b> ruota anti-hor.<br>
    <b>↓</b> soft drop<br>
    <b>Spazio</b> hard drop<br>
    <b>C</b> hold<br>
    <b>P</b> pausa
  </div>
</div>

<script>
"use strict";
/* =========================================================
   TETRIS — single file, procedural graphics & audio
   ========================================================= */

// ---------- Canvas setup ----------
const COLS = 10, ROWS = 20, CELL = 30;
const boardCv = document.getElementById('board');
const boardCtx = boardCv.getContext('2d');
boardCv.width = COLS * CELL;
boardCv.height = ROWS * CELL;

const holdCv = document.getElementById('hold'), holdCtx = holdCv.getContext('2d');
const nextCv = document.getElementById('next'), nextCtx = nextCv.getContext('2d');
const starsCv = document.getElementById('stars'), starsCtx = starsCv.getContext('2d');

function resizeStars(){ starsCv.width = innerWidth; starsCv.height = innerHeight; }
addEventListener('resize', resizeStars); resizeStars();

// ---------- Tetromino definitions ----------
// Each shape: array of rotation states, each state = array of [x,y] cells.
const SHAPES = {
  I: [
    [[0,1],[1,1],[2,1],[3,1]],
    [[2,0],[2,1],[2,2],[2,3]],
    [[0,2],[1,2],[2,2],[3,2]],
    [[1,0],[1,1],[1,2],[1,3]]
  ],
  O: [
    [[1,0],[2,0],[1,1],[2,1]]
  ],
  T: [
    [[1,0],[0,1],[1,1],[2,1]],
    [[1,0],[1,1],[2,1],[1,2]],
    [[0,1],[1,1],[2,1],[1,2]],
    [[1,0],[0,1],[1,1],[1,2]]
  ],
  S: [
    [[1,0],[2,0],[0,1],[1,1]],
    [[1,0],[1,1],[2,1],[2,2]],
    [[1,1],[2,1],[0,2],[1,2]],
    [[0,0],[0,1],[1,1],[1,2]]
  ],
  Z: [
    [[0,0],[1,0],[1,1],[2,1]],
    [[2,0],[1,1],[2,1],[1,2]],
    [[0,1],[1,1],[1,2],[2,2]],
    [[1,0],[0,1],[1,1],[0,2]]
  ],
  J: [
    [[0,0],[0,1],[1,1],[2,1]],
    [[1,0],[2,0],[1,1],[1,2]],
    [[0,1],[1,1],[2,1],[2,2]],
    [[1,0],[1,1],[0,2],[1,2]]
  ],
  L: [
    [[2,0],[0,1],[1,1],[2,1]],
    [[1,0],[1,1],[1,2],[2,2]],
    [[0,1],[1,1],[2,1],[0,2]],
    [[0,0],[1,0],[1,1],[1,2]]
  ]
};
// NES-ish palette with a glow companion
const COLORS = {
  I: { main:'#00e5ff', light:'#b9fdff', dark:'#007a99' },
  O: { main:'#ffd500', light:'#fff4b0', dark:'#997a00' },
  T: { main:'#b44cff', light:'#e2b8ff', dark:'#5c1a99' },
  S: { main:'#3ef06a', light:'#c2ffc9', dark:'#15803a' },
  Z: { main:'#ff3d5a', light:'#ffb3bf', dark:'#99122a' },
  J: { main:'#3d6bff', light:'#b3c4ff', dark:'#16339a' },
  L: { main:'#ff9b1f', light:'#ffd9a8', dark:'#995a06' }
};

// ---------- Audio (procedural, WebAudio) ----------
let AC = null;
function audio(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
// tiny helper: square wave blip (Game-Boy style)
function blip(freq, dur, {type='square', vol=0.16, slide=0, delay=0} = {}){
  try{
    const ac = audio();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
// noise burst (for hard drop thud / game over crash)
function noise(dur, {vol=0.25, freq=1200, delay=0} = {}){
  try{
    const ac = audio();
    const t = ac.currentTime + delay;
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(ac.destination);
    src.start(t);
  }catch(e){}
}
const SFX = {
  move:    () => blip(210, .05, {vol:.08}),
  rotate:  () => blip(440, .06, {vol:.1, slide:120}),
  softDrop:() => blip(140, .03, {vol:.05}),
  hardDrop:() => { noise(.12, {vol:.3, freq:900}); blip(80, .1, {type:'triangle', vol:.3}); },
  hold:    () => blip(560, .07, {vol:.12, slide:-120}),
  lock:    () => blip(180, .06, {vol:.12, slide:-60}),
  clear1:  () => { blip(523,.07,{delay:0}); blip(659,.07,{delay:.06}); blip(784,.09,{delay:.12}); },
  clear2:  () => { blip(523,.06,{delay:0}); blip(659,.06,{delay:.05}); blip(784,.06,{delay:.1}); blip(1047,.12,{delay:.15}); },
  clear4:  () => { [523,659,784,1047,1319,1568].forEach((f,i)=>blip(f,.09,{delay:i*.055,vol:.18})); },
  levelUp: () => { [392,523,659,784,1047].forEach((f,i)=>blip(f,.1,{delay:i*.07,vol:.18})); },
  topOut:  () => { [440,349,262,196,131].forEach((f,i)=>blip(f,.22,{delay:i*.16,vol:.2,slide:-20}));
                    noise(.5,{vol:.25,freq:600,delay:.05}); },
  start:   () => { [262,330,392,523].forEach((f,i)=>blip(f,.1,{delay:i*.08})); }
};

// ---------- Game state ----------
let grid, piece, nextQueue = [], holdType = null, canHold = true;
let score = 0, lines = 0, level = 1;
let state = 'menu'; // menu | play | clear | over | paused
let dropTimer = 0, lastTime = 0;
let clearAnim = null; // {rows, t}
let particles = [];
let shake = 0;
let flash = 0; // full-board white flash on tetris

function emptyGrid(){ return Array.from({length:ROWS}, ()=>Array(COLS).fill(null)); }

// 7-bag randomizer
function refillBag(){
  const bag = Object.keys(SHAPES);
  for(let i=bag.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [bag[i],bag[j]] = [bag[j],bag[i]];
  }
  nextQueue.push(...bag);
}
function nextType(){
  if(nextQueue.length < 5) refillBag();
  return nextQueue.shift();
}

function spawnPiece(type){
  const rot = 0;
  piece = {
    type, rot,
    x: type==='I' ? 3 : 3,
    y: type==='I' ? -1 : 0,
    cells: SHAPES[type][rot].map(c=>[c[0],c[1]])
  };
  canHold = true;
  if(collides(piece.cells, piece.x, piece.y)){
    gameOver();
  }
}
function collides(cells, px, py){
  for(const [cx,cy] of cells){
    const x = px+cx, y = py+cy;
    if(x<0||x>=COLS||y>=ROWS) return true;
    if(y>=0 && grid[y][x]) return true;
  }
  return false;
}
function ghostY(){
  let gy = piece.y;
  while(!collides(piece.cells, piece.x, gy+1)) gy++;
  return gy;
}
function rotate(dir){
  if(piece.type==='O') return;
  const nr = (piece.rot + dir + 4) % 4;
  const nc = SHAPES[piece.type][nr];
  // basic wall kicks
  const kicks = [0,-1,1,-2,2];
  for(const k of kicks){
    if(!collides(nc, piece.x+k, piece.y)){
      piece.x += k; piece.rot = nr; piece.cells = nc;
      SFX.rotate(); return;
    }
    if(!collides(nc, piece.x+k, piece.y-1)){
      piece.x += k; piece.y -= 1; piece.rot = nr; piece.cells = nc;
      SFX.rotate(); return;
    }
  }
}
function move(dx){
  if(!collides(piece.cells, piece.x+dx, piece.y)){
    piece.x += dx; SFX.move(); return true;
  }
  return false;
}
function softDrop(){
  if(!collides(piece.cells, piece.x, piece.y+1)){
    piece.y++; score += 1; SFX.softDrop(); updateHUD(); return true;
  }
  return false;
}
function hardDrop(){
  const gy = ghostY();
  score += Math.max(0,(gy - piece.y)) * 2;
  piece.y = gy;
  SFX.hardDrop();
  shake = 5;
  lockPiece();
}
function doHold(){
  if(!canHold) return;
  SFX.hold();
  const cur = piece.type;
  if(holdType){
    const t = holdType;
    holdType = cur;
    spawnPiece(t);
  } else {
    holdType = cur;
    spawnPiece(nextType());
  }
  canHold = false;
}
function lockPiece(){
  for(const [cx,cy] of piece.cells){
    const x = piece.x+cx, y = piece.y+cy;
    if(y>=0 && y<ROWS && x>=0 && x<COLS) grid[y][x] = piece.type;
  }
  SFX.lock();
  const full = [];
  for(let y=0;y<ROWS;y++) if(grid[y].every(c=>c)) full.push(y);
  if(full.length){
    SFX[full.length===4?'clear4':full.length>=2?'clear2':'clear1']();
    if(full.length===4){ flash = 1; shake = 10; }
    else shake = Math.max(shake, 3 + full.length*2);
    // spawn particles along the cleared rows
    for(const y of full){
      for(let x=0;x<COLS;x++){
        const t = grid[y][x];
        const col = COLORS[t].main;
        for(let p=0;p<3;p++){
          particles.push({
            x:(x+0.5)*CELL, y:(y+0.5)*CELL,
            vx:(Math.random()-0.5)*260, vy:(Math.random()-0.8)*260,
            life:0.5+Math.random()*0.4, maxLife:0.9,
            size:2+Math.random()*3, col
          });
        }
      }
    }
    // remove rows
    full.sort((a,b)=>a-b).forEach(y=>{ grid.splice(y,1); grid.unshift(Array(COLS).fill(null)); });
    score += [0,100,300,500,800][full.length] * level;
    lines += full.length;
    const newLevel = Math.floor(lines/10)+1;
    if(newLevel > level){ level = newLevel; SFX.levelUp(); }
    updateHUD();
    // brief clear animation state
    clearAnim = { t: 0.28, rows: full };
    state = 'clear';
  } else {
    spawnPiece(nextType());
  }
}
function gameOver(){
  state = 'over';
  SFX.topOut();
  showOverlay('GAME OVER', `Punteggio finale`, score.toLocaleString('it-IT'), 'PREMI INVIO PER RIGIOCARE');
}
function dropInterval(){ return Math.max(80, 800 * Math.pow(0.82, level-1)); }

function resetGame(){
  grid = emptyGrid();
  nextQueue = []; holdType = null; canHold = true;
  score = 0; lines = 0; level = 1;
  dropTimer = 0; particles = []; shake = 0; flash = 0; clearAnim = null;
  updateHUD();
  spawnPiece(nextType());
  state = 'play';
  hideOverlay();
  SFX.start();
}

// ---------- HUD / Overlay ----------
const el = id => document.getElementById(id);
function updateHUD(){
  el('score').textContent = score.toLocaleString('it-IT');
  el('level').textContent = level;
  el('lines').textContent = lines;
}
function showOverlay(title, msg, big, blink){
  el('ovTitle').textContent = title;
  el('ovMsg').textContent = msg;
  el('ovBig').textContent = big;
  el('ovBlink').textContent = blink;
  el('overlay').classList.remove('hidden');
}
function hideOverlay(){ el('overlay').classList.add('hidden'); }

// ---------- Rendering ----------
function drawCell(ctx, px, py, size, col, ghost=false, alpha=1){
  const c = COLORS[col];
  ctx.save();
  ctx.globalAlpha = alpha;
  if(ghost){
    ctx.strokeStyle = c.main;
    ctx.lineWidth = 2;
    ctx.setLineDash([5,4]);
    ctx.strokeRect(px+3, py+3, size-6, size-6);
    ctx.restore();
    return;
  }
  // glow
  ctx.shadowColor = c.main;
  ctx.shadowBlur = 10;
  ctx.fillStyle = c.main;
  ctx.fillRect(px+1, py+1, size-2, size-2);
  ctx.shadowBlur = 0;
  // bevel: light top-left, dark bottom-right (classic block)
  ctx.fillStyle = c.light;
  ctx.fillRect(px+1, py+1, size-2, 5);
  ctx.fillRect(px+1, py+1, 5, size-2);
  ctx.fillStyle = c.dark;
  ctx.fillRect(px+1, py+size-6, size-2, 5);
  ctx.fillRect(px+size-6, py+1, 5, size-2);
  // inner shine
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fillRect(px+6, py+6, size-12, size-12);
  ctx.restore();
}
function drawMiniPiece(ctx, type, cx, cy, cellSize){
  const cells = SHAPES[type][0];
  const xs = cells.map(c=>c[0]), ys = cells.map(c=>c[1]);
  const w = (Math.max(...xs)-Math.min(...xs)+1)*cellSize;
  const h = (Math.max(...ys)-Math.min(...ys)+1)*cellSize;
  const ox = cx - w/2, oy = cy - h/2;
  for(const [gx,gy] of cells){
    drawCell(ctx, ox + (gx-Math.min(...xs))*cellSize, oy + (gy-Math.min(...ys))*cellSize, cellSize, type);
  }
}
function drawBoard(){
  const ctx = boardCtx;
  ctx.clearRect(0,0,boardCv.width,boardCv.height);
  // camera shake
  if(shake > 0){
    ctx.save();
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  // background
  const bg = ctx.createLinearGradient(0,0,0,boardCv.height);
  bg.addColorStop(0,'#0a0424');
  bg.addColorStop(1,'#03010d');
  ctx.fillStyle = bg;
  ctx.fillRect(-10,-10,boardCv.width+20,boardCv.height+20);
  // grid lines
  ctx.strokeStyle = 'rgba(0,240,255,0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=1;x<COLS;x++){ ctx.moveTo(x*CELL+.5,0); ctx.lineTo(x*CELL+.5,ROWS*CELL); }
  for(let y=1;y<ROWS;y++){ ctx.moveTo(0,y*CELL+.5); ctx.lineTo(COLS*CELL,y*CELL+.5); }
  ctx.stroke();
  // danger zone glow near top
  if(grid){
    let topY = ROWS;
    outer: for(let y=0;y<ROWS;y++){ for(let x=0;x<COLS;x++){ if(grid[y][x]){ topY=y; break outer; } } }
    if(topY < 6){
      const g = ctx.createLinearGradient(0,0,0,200);
      g.addColorStop(0,`rgba(255,40,60,${0.28*(1-topY/6)})`);
      g.addColorStop(1,'rgba(255,40,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,boardCv.width,200);
    }
  }
  // locked cells
  if(grid){
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(grid[y][x]) drawCell(ctx, x*CELL, y*CELL, CELL, grid[y][x]);
    }
  }
  // clear animation: flashing white rows
  if(clearAnim && clearAnim.t > 0 && grid){
    const a = clearAnim.t / 0.28;
    for(let y=0;y<ROWS;y++){
      if(clearAnim.rows.includes(y)){
        ctx.fillStyle = `rgba(255,255,255,${a*0.9})`;
        ctx.fillRect(0,y*CELL,COLS*CELL,CELL);
      }
    }
  }
  // ghost + active piece
  if(piece && (state==='play' || state==='clear')){
    const gy = ghostY();
    for(const [cx,cy] of piece.cells){
      const y = gy+cy;
      if(y>=0) drawCell(ctx, (piece.x+cx)*CELL, y*CELL, CELL, piece.type, true);
    }
    for(const [cx,cy] of piece.cells){
      const y = piece.y+cy;
      if(y>=0) drawCell(ctx, (piece.x+cx)*CELL, y*CELL, CELL, piece.type);
    }
  }
  // particles
  for(const p of particles){
    const a = Math.max(0, p.life/p.maxLife);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = p.col; ctx.shadowBlur = 8;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.restore();
  }
  // tetris flash
  if(flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${flash*0.55})`;
    ctx.fillRect(0,0,boardCv.width,boardCv.height);
  }
  if(shake > 0) ctx.restore();
}
function drawSidePanels(){
  holdCtx.clearRect(0,0,holdCv.width,holdCv.height);
  if(holdType) drawMiniPiece(holdCtx, holdType, holdCv.width/2, holdCv.height/2, 20);
  nextCtx.clearRect(0,0,nextCv.width,nextCv.height);
  for(let i=0;i<3 && nextQueue[i];i++){
    drawMiniPiece(nextCtx, nextQueue[i], nextCv.width/2, 35 + i*70, i===0 ? 18 : 15);
  }
}
function drawStars(dt){
  const ctx = starsCtx, W = starsCv.width, H = starsCv.height;
  ctx.clearRect(0,0,W,H);
  if(!drawStars.pts){
    drawStars.pts = Array.from({length:130},()=>({
      x:Math.random()*W, y:Math.random()*H,
      z:0.2+Math.random()*0.8, tw:Math.random()*Math.PI*2
    }));
  }
  const t = performance.now()/1000;
  for(const s of drawStars.pts){
    s.y += s.z * 12 * dt;
    if(s.y > H){ s.y = -2; s.x = Math.random()*W; }
    const a = 0.25 + 0.55*Math.abs(Math.sin(t*s.z + s.tw));
    ctx.fillStyle = s.z>0.7 ? `rgba(190,240,255,${a})` : `rgba(255,190,255,${a*0.7})`;
    ctx.fillRect(s.x, s.y, s.z>0.7?2:1, s.z>0.7?2:1);
  }
}

// ---------- Main loop ----------
function update(dt){
  // stars always
  drawStars(dt);
  // decay effects
  if(shake>0) shake = Math.max(0, shake - dt*22);
  if(flash>0) flash = Math.max(0, flash - dt*2.2);
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy += 500*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  if(state==='clear'){
    if(clearAnim) clearAnim.t -= dt;
    if(clearAnim && clearAnim.t<=0){
      clearAnim = null;
      spawnPiece(nextType());
      state = 'play';
      dropTimer = 0;
    }
  }
  if(state==='play' && piece){
    dropTimer += dt*1000;
    while(dropTimer > dropInterval()){
      dropTimer -= dropInterval();
      if(!collides(piece.cells, piece.x, piece.y+1)){
        piece.y++;
      } else {
        lockPiece();
        break;
      }
    }
  }
  drawBoard();
  drawSidePanels();
}
function loop(ts){
  const dt = Math.min(0.05, (ts - lastTime)/1000 || 0.016);
  lastTime = ts;
  update(dt);
  requestAnimationFrame(loop);
}

// ---------- Input ----------
let dasTimer = 0, dasDir = 0, dasDelay = 170, arrDelay = 40, arrTimer = 0;
addEventListener('keydown', e => {
  if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key)) e.preventDefault();
  if(e.repeat && !['ArrowLeft','ArrowRight','ArrowDown'].includes(e.key)) return;

  if(e.key === 'Enter'){
    if(state==='menu' || state==='over'){ resetGame(); }
    return;
  }
  if(e.key==='p' || e.key==='P'){
    if(state==='play'){ state='paused'; showOverlay('PAUSA','','','PREMI P PER RIPRENDERE'); }
    else if(state==='paused'){ state='play'; hideOverlay(); }
    return;
  }
  if(state!=='play') return;

  switch(e.key){
    case 'ArrowLeft':  dasDir=-1; dasTimer=0; arrTimer=0; move(-1); break;
    case 'ArrowRight': dasDir=1;  dasTimer=0; arrTimer=0; move(1); break;
    case 'ArrowDown':  softDrop(); break;
    case 'ArrowUp': case 'x': case 'X': rotate(1); break;
    case 'z': case 'Z': rotate(-1); break;
    case ' ': hardDrop(); break;
    case 'c': case 'C': doHold(); break;
  }
});
addEventListener('keyup', e => {
  if(e.key==='ArrowLeft' && dasDir===-1) dasDir=0;
  if(e.key==='ArrowRight' && dasDir===1) dasDir=0;
});
// DAS (auto-shift) handled in update loop
const _update = update;
update = function(dt){
  _update(dt);
  if(state==='play' && dasDir!==0){
    dasTimer += dt*1000;
    if(dasTimer > dasDelay){
      arrTimer += dt*1000;
      while(arrTimer > arrDelay){
        arrTimer -= arrDelay;
        if(!move(dasDir)) break;
      }
    }
  }
};
// unlock audio on first interaction
addEventListener('pointerdown', ()=>audio(), {once:false});

// ---------- Boot ----------
grid = emptyGrid();
showOverlay('TETRIS',
  'Fai cadere i tetramini ed elimina le linee complete.\nOgni 10 linee il livello sale e la velocità aumenta.',
  '',
  'PREMI INVIO PER INIZIARE');
requestAnimationFrame(loop);
</script>
